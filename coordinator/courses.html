<main>
<h2>Department Courses</h2>
<form action="#" method="post">
<fieldset><legend><b>Add course</b></legend>
<p><label for="code">Course code</label><br><input type="text" id="code" name="code" required pattern="[A-Z]{3}[0-9]{3}" placeholder="CSE101"></p>
<p><label for="title">Course title</label><br><input type="text" id="title" name="title" required></p>
<button type="submit">Add course</button> <button type="reset">Reset</button>
</fieldset></form>
<table border="1" cellpadding="6" cellspacing="0"><thead><tr><th>Code</th><th>Title</th><th>Actions</th></tr></thead><tbody><tr><td>CSE101</td><td>Programming Fundamentals</td><td><a href="#edit-course">Edit</a> <form action="#" method="post" style="display:inline"><input type="hidden" name="id" value="1"><input type="hidden" name="action" value="delete"><button type="submit">Delete</button></form></td></tr></tbody></table>
<form id="edit-course" action="#" method="post">
<fieldset><legend><b>Edit course</b></legend>
<input type="hidden" name="id" value="1">
<p><label for="code">Course code</label><br><input type="text" id="code" name="code" required></p>
<p><label for="title">Course title</label><br><input type="text" id="title" name="title" required></p>
<button type="submit">Update course</button> <button type="reset">Reset</button>
</fieldset></form>
</main>
