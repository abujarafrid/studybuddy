<main>
<h2>Book a Tutor</h2>
<form action="#" method="post">
<fieldset><legend><b>Session booking</b></legend>
<p><label for="tutor">Tutor</label><br><select id="tutor" name="tutor" required><option value="">-- Select --</option><option value="Rahim (CSE201, CSE301) - 4.8">Rahim (CSE201, CSE301) - 4.8</option><option value="Sadia (MAT101, PHY101) - 4.6">Sadia (MAT101, PHY101) - 4.6</option></select></p>
<p><label for="course">Course</label><br><select id="course" name="course" required><option value="">-- Select --</option><option value="CSE101 Programming Fundamentals">CSE101 Programming Fundamentals</option><option value="CSE201 Data Structures">CSE201 Data Structures</option><option value="MAT101 Calculus">MAT101 Calculus</option><option value="PHY101 Physics">PHY101 Physics</option><option value="CSE301 Machine Learning">CSE301 Machine Learning</option></select></p>
<p><label for="slot">Available slot</label><br><select id="slot" name="slot" required><option value="">-- Select --</option><option value="Mon 18:00-19:00">Mon 18:00-19:00</option><option value="Wed 20:00-21:00">Wed 20:00-21:00</option><option value="Sat 10:00-11:00">Sat 10:00-11:00</option></select></p>
<p><label for="date">Date</label><br><input type="date" id="date" name="date" required></p>
<p><label for="topic">Topic</label><br><input type="text" id="topic" name="topic" required maxlength="150"></p>
<fieldset><legend>Method</legend><label><input type="radio" name="method" value="online" required> Online</label> <label><input type="radio" name="method" value="in_person"> In-person</label> <label><input type="radio" name="method" value="hybrid"> Hybrid</label> </fieldset>
<p><label for="notes">Notes for tutor</label><br><textarea id="notes" name="notes" rows="4" cols="40" maxlength="255"></textarea></p>
<button type="submit">Book session</button> <button type="reset">Reset</button>
</fieldset></form>
</main>
<hr>
<footer><p>StudyBuddy: Peer Tutoring and Study Partner Finder &copy; 2026</p></footer>
<script src="../js/app.js"></script>
</body>
