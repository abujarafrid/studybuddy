<main>
<h2>Reset Password</h2>
<form action="#" method="post">
<fieldset><legend><b>Set a new password</b></legend>
<input type="hidden" name="token" value="">
<p><label for="password">New password</label><br><input type="password" id="password" name="password" required minlength="8"></p>
<p><label for="confirm_password">Confirm new password</label><br><input type="password" id="confirm_password" name="confirm_password" required minlength="8"></p>
<button type="submit">Reset password</button> <button type="reset">Reset</button>
</fieldset></form>
</main>
