<main>
<h2>Change Password</h2>
<form action="#" method="post">
<fieldset><legend><b>Change password</b></legend>
<p><label for="current_password">Current password</label><br><input type="password" id="current_password" name="current_password" required></p>
<p><label for="new_password">New password</label><br><input type="password" id="new_password" name="new_password" required minlength="8"></p>
<p><label for="confirm_password">Confirm new password</label><br><input type="password" id="confirm_password" name="confirm_password" required minlength="8"></p>
<button type="submit">Update password</button> <button type="reset">Reset</button>
</fieldset></form>
</main>
