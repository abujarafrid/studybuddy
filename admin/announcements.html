<header><h1>StudyBuddy</h1><nav><a href="../index.html">Home</a> | <a href="../admin/dashboard.html">Dashboard</a> | <a href="../admin/users.html">Users</a> | <a href="../admin/departments.html">Departments</a> | <a href="../admin/announcements.html">Announcements</a> | <a href="../admin/analytics.html">Analytics</a> | <a href="../profile.html">My Profile</a> | <a href="../change-password.html">Change Password</a> | <a href="../login.html">Logout</a></nav></header>

<main>
<h2>Announcements</h2>
<form action="#" method="post">
<fieldset><legend><b>New announcement</b></legend>
<p><label for="title">Title</label><br><input type="text" id="title" name="title" required maxlength="120"></p>
<p><label for="body">Message</label><br><textarea id="body" name="body" rows="4" cols="40" required></textarea></p>
<p><label for="until">Show until</label><br><input type="date" id="until" name="until" ></p>
<button type="submit">Publish</button> <button type="reset">Reset</button>
</fieldset></form>
<table border="1" cellpadding="6" cellspacing="0"><thead><tr><th>Title</th><th>Posted</th><th>Actions</th></tr></thead><tbody><tr><td>Midterm study week</td><td>2026-10-20</td><td><a href="#edit-ann">Edit</a> <form action="#" method="post" style="display:inline"><input type="hidden" name="id" value="1"><input type="hidden" name="action" value="delete"><button type="submit">Delete</button></form></td></tr></tbody></table>
<form id="edit-ann" action="#" method="post">
<fieldset><legend><b>Edit announcement</b></legend>
<input type="hidden" name="id" value="1">
<p><label for="title">Title</label><br><input type="text" id="title" name="title" required></p>
<p><label for="body">Message</label><br><textarea id="body" name="body" rows="4" cols="40" required></textarea></p>
<button type="submit">Update</button> <button type="reset">Reset</button>
</fieldset></form>
</main>

</body>
</html>
